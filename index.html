<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoomFinder Pro - Live Geospatial Portal</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand-primary: #10b981;
            --brand-primary-hover: #059669;
            --bg-dark: #0f172a;
            --text-main: #334155;
            --text-muted: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --radius-lg: 16px;
            --radius-sm: 8px;
            --smooth-shadow: 0 10px 30px -5px rgba(2, 6, 23, 0.1), 0 4px 12px -4px rgba(2, 6, 23, 0.05);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: 'Plus Jakarta Sans', Arial, sans-serif;
            background: #f8fafc;
            color: var(--text-main);
            overflow: hidden;
        }

        /* PREMIUM GLASSMORPHISM AUTH SCREEN */
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            z-index: 99999; display: flex; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }

        .auth-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px; border-radius: 24px; width: 380px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center; color: white;
        }

        .auth-input {
            width: 100%; padding: 14px 16px; margin-top: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; box-sizing: border-box;
            color: white; font-family: inherit; font-size: 14px; outline: none;
        }
        .auth-input:focus { border-color: var(--brand-primary); background: rgba(255, 255, 255, 0.08); }

        .auth-btn {
            width: 100%; padding: 14px; background: var(--brand-primary);
            color: white; border: none; border-radius: 12px; font-weight: 700;
            font-size: 15px; cursor: pointer; margin-top: 24px; font-family: inherit;
            box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.4);
        }
        .auth-btn:hover { background: var(--brand-primary-hover); }

        .auth-toggle {
            margin-top: 16px; font-size: 13px; color: #94a3b8; cursor: pointer;
        }
        .auth-toggle span { color: var(--brand-primary); font-weight: 600; }

        /* MAIN APP INTERFACE (HIDDEN BY DEFAULT UNTIL LOGIN) */
        #app-interface {
            display: none; width: 100%; height: 100%;
        }

        #map { flex: 1; height: 100%; z-index: 1; }

        /* NAVBAR TOP */
        #header-bar {
            position: absolute; top: 20px; left: 20px; right: 20px; z-index: 1000;
            background: var(--glass-bg); backdrop-filter: blur(12px);
            padding: 12px 24px; border-radius: 40px;
            box-shadow: var(--smooth-shadow); display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .header-left { display: flex; align-items: center; gap: 16px; }
        .header-right { display: flex; align-items: center; gap: 12px; }

        #free-badge {
            background: #dcfce7; color: #15803d; padding: 6px 14px;
            border-radius: 30px; font-size: 12px; font-weight: 700;
        }

        /* REGISTER PROPERTY TRIGGER */
        #sidebar-toggle-btn {
            position: absolute; bottom: 30px; right: 30px; z-index: 1000;
            background: var(--brand-primary); color: white; border: none;
            padding: 16px 28px; border-radius: 40px; font-weight: 700;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4); cursor: pointer;
            display: flex; align-items: center; gap: 8px; font-family: inherit; font-size: 15px;
            transition: all 0.25s ease;
        }
        #sidebar-toggle-btn:hover { background: var(--brand-primary-hover); transform: translateY(-2px); }

        /* REGISTRATION SIDEBAR PANEL */
        #sidebar {
            width: 400px; height: 100%; background: white;
            position: absolute; right: -400px; top: 0; z-index: 1001;
            box-shadow: -10px 0 40px rgba(15, 23, 42, 0.08);
            padding: 100px 30px 30px 30px; box-sizing: border-box;
            overflow-y: auto; transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 1px solid #f1f5f9;
        }
        #sidebar.open { right: 0; }

        .sidebar-close-btn {
            position: absolute; top: 105px; right: 30px; background: #f1f5f9;
            border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
            font-weight: bold; color: var(--text-muted);
        }

        form label { font-size: 13px; font-weight: 600; color: #475569; display: block; margin-top: 14px; }
        form input, form textarea {
            width: 100%; padding: 11px 14px; border: 1px solid #cbd5e1;
            border-radius: 10px; box-sizing: border-box; margin-top: 6px; font-size: 14px;
            font-family: inherit; transition: border 0.2s;
        }
        form input:focus, form textarea:focus { outline: none; border-color: var(--brand-primary); }
        
        .publish-btn {
            width: 100%; padding: 14px; background: var(--brand-primary); color: white;
            font-weight: 700; border: none; border-radius: 12px; cursor: pointer; margin-top: 25px;
            font-family: inherit; font-size: 15px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }
        .publish-btn:hover { background: var(--brand-primary-hover); }

        /* SCRATCH CARD SYSTEM */
        .scratch-box {
            position: relative; width: 220px; height: 55px; margin: 12px auto;
            background: #fff; border: 2px dashed #e2e8f0; display: flex;
            border-radius: 10px; overflow: hidden;
            align-items: center; justify-content: center; font-weight: 700; font-size: 16px; color: var(--brand-primary);
        }
        .scratch-canvas { position: absolute; top: 0; left: 0; cursor: pointer; }

        /* MODAL DIALOG POPUP */
        .app-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px);
            z-index: 10005; display: none; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .app-modal.show { display: flex; opacity: 1; }
        
        .modal-content {
            background: white; width: 600px; max-width: 92%; border-radius: 24px;
            overflow: hidden; box-shadow: 0 30px 60px -15px rgba(0,0,0,0.3);
            position: relative; display: flex; flex-direction: column;
        }

        .modal-close-btn {
            position: absolute; top: 20px; right: 20px; background: #f1f5f9;
            color: var(--bg-dark); border: none; width: 36px; height: 36px; border-radius: 50%;
            font-size: 14px; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center;
        }
        .modal-hero-img { width: 100%; height: 300px; object-fit: cover; background: #cbd5e1; }
        .modal-body { padding: 30px; }
        .modal-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-rent-tag { font-size: 28px; font-weight: 800; color: #047857; }
        .modal-desc { color: #475569; font-size: 15px; line-height: 1.6; background: #f8fafc; padding: 15px; border-radius: 12px; }

        .leaflet-popup-content-wrapper { border-radius: 16px; padding: 6px; box-shadow: var(--smooth-shadow); }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-container">
            <h2 id="auth-title" style="margin: 0 0 8px 0; font-size: 26px; font-weight: 800; letter-spacing: -0.5px;">Welcome Back</h2>
            <p id="auth-subtitle" style="margin: 0 0 24px 0; font-size: 14px; color: #94a3b8;">Sign in to access your geospatial room panel</p>
            
            <form id="authForm" onsubmit="handleAuthSubmit(event)">
                <input type="text" id="auth_username" class="auth-input" required placeholder="Username">
                <input type="password" id="auth_password" class="auth-input" required placeholder="Password">
                <button type="submit" id="auth-submit-btn" class="auth-btn">Sign In</button>
            </form>
            
            <div class="auth-toggle" onclick="toggleAuthMode()">
                Don't have an account? <span id="auth-toggle-text">Sign Up</span>
            </div>
        </div>
    </div>

    <div id="app-interface">
        <div id="header-bar">
            <div class="header-left">
                <strong style="font-size: 18px; font-weight: 800; color: var(--bg-dark);">RoomFinder Pro 🏠</strong>
                <span id="free-badge">Checking Slots...</span>
            </div>
            <div class="header-right">
                <input type="number" id="budgetInput" placeholder="Max Rent (₹)" style="padding: 8px 16px; border-radius: 30px; border: 1px solid #cbd5e1; width: 120px; font-family: inherit; font-size: 13px; text-align: center; outline:none;">
                <button onclick="fetchNearbyRooms()" style="background: #2563eb; color: white; border: none; padding: 8px 18px; border-radius: 30px; cursor: pointer; font-weight: 700; font-family: inherit; font-size: 13px;">Filter</button>
                <button onclick="handleLogout()" style="background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 30px; cursor: pointer; font-weight: 700; font-family: inherit; font-size: 13px;">Logout</button>
            </div>
        </div>

        <button id="sidebar-toggle-btn" onclick="openSidebar()">
            <span>➕</span> <span>Register Property</span>
        </button>

        <div id="map"></div>

        <div id="sidebar">
            <button class="sidebar-close-btn" onclick="closeSidebar()">✕</button>
            <h3 style="margin:0 0 6px 0; font-size:22px; font-weight:800; color:var(--bg-dark);">List Your Room 🎉</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin:0 0 20px 0;">Click anywhere on the map first to fetch node coordinates automatically.</p>
            
            <form id="roomForm" onsubmit="submitRoom(event)">
                <label>Landlord Name</label>
                <input type="text" id="form_name" required placeholder="e.g. Rajesh Kumar">
                
                <label>Phone Number</label>
                <input type="tel" id="form_phone" required placeholder="e.g. 9876543210">
                
                <label>Monthly Rent (₹)</label>
                <input type="number" id="form_rent" required placeholder="e.g. 5000">
                
                <label>Description</label>
                <textarea id="form_desc" rows="3" required placeholder="Water details, current layout structure info..."></textarea>
                
                <label>Upload Room Image</label>
                <input type="file" id="form_files" accept="image/*" required style="border:1px dashed #cbd5e1; background:#f8fafc; padding:12px; border-radius:10px; cursor:pointer;">
                
                <label>Latitude Pin Location</label>
                <input type="text" id="form_lat" readonly required style="background: #f1f5f9; color: var(--text-muted); font-weight: 600;">
                
                <label>Longitude Pin Location</label>
                <input type="text" id="form_lng" readonly required style="background: #f1f5f9; color: var(--text-muted); font-weight: 600;">
                
                <button type="submit" class="publish-btn">Publish Property Now</button>
            </form>
        </div>
    </div>

    <div id="details-modal" class="app-modal" onclick="closeModal('details-modal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close-btn" onclick="closeModal('details-modal')">✕</button>
            <img id="modal-img" class="modal-hero-img" src="" alt="Property View">
            <div class="modal-body">
                <div class="modal-header-flex">
                    <h2 style="margin:0; color:var(--bg-dark); font-weight:800; font-size:22px;">Verified Property Space</h2>
                    <div id="modal-rent" class="modal-rent-tag">₹0/mo</div>
                </div>
                <p id="modal-desc" class="modal-desc">Loading metadata...</p>
                
                <div style="background: #f8fafc; padding: 20px; border-radius: 16px; text-align: center; border: 1px dashed #cbd5e1; margin-top:20px;">
                    <h4 style="margin: 0 0 12px 0; color: var(--bg-dark); font-weight:700;">🔒 Secure Landlord Escrow</h4>
                    <div id="modal-contact-wrapper"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const API_BASE_URL = "https://roomfinder-backend-t7b8.onrender.com";
        const NAGPUR_LAT = 21.1458;
        const NAGPUR_LNG = 79.0882;
        
        let map;
        let globalCachedRooms = [];
        let isSignUpMode = false;
        let authToken = localStorage.getItem('token') || null;

        window.onload = function() {
            if (authToken) {
                bypassAuthScreen();
            }
        };

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('auth-title').innerText = isSignUpMode ? "Create Account" : "Welcome Back";
            document.getElementById('auth-subtitle').innerText = isSignUpMode ? "Sign up to register free rooms" : "Sign in to access your geospatial room panel";
            document.getElementById('auth-submit-btn').innerText = isSignUpMode ? "Sign Up" : "Sign In";
            document.getElementById('auth-toggle-text').innerText = isSignUpMode ? "Sign In" : "Sign Up";
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const username = document.getElementById('auth_username').value;
            const password = document.getElementById('auth_password').value;
            const endpoint = isSignUpMode ? "/api/auth/signup" : "/api/auth/login";

            try {
                // Backend requires form-data / URL encoded form for standard OAuth2 layout
                let details = { 'username': username, 'password': password };
                let formBody = [];
                for (let property in details) {
                    let encodedKey = encodeURIComponent(property);
                    let encodedValue = encodeURIComponent(details[property]);
                    formBody.push(encodedKey + "=" + encodedValue);
                }
                formBody = formBody.join("&");

                let response = await fetch(`${API_BASE_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                    body: formBody
                });

                let data = await response.json();
                if (response.ok && data.access_token) {
                    authToken = data.access_token;
                    localStorage.setItem('token', authToken);
                    bypassAuthScreen();
                } else {
                    alert(data.detail || "Authentication pipeline transaction failed.");
                }
            } catch (err) {
                alert("Server interface engine breakdown. Waking up instance...");
            }
        }

        function bypassAuthScreen() {
            document.getElementById('auth-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-interface').style.display = 'flex';
                initializeSystemMap();
                loadStats();
                fetchNearbyRooms();
            }, 500);
        }

        function handleLogout() {
            localStorage.clear();
            location.reload();
        }

        function openSidebar() { document.getElementById('sidebar').classList.add('open'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); }

        function initializeSystemMap() {
            if (map) return;
            map = L.map('map', { zoomControl: false }).setView([NAGPUR_LAT, NAGPUR_LNG], 13);
            L.control.zoom({ position: 'bottomleft' }).addTo(map);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            map.on('click', function(e) {
                document.getElementById('form_lat').value = e.latlng.lat.toFixed(6);
                document.getElementById('form_lng').value = e.latlng.lng.toFixed(6);
                openSidebar();
            });
        }

        async function loadStats() {
            try {
                let response = await fetch(`${API_BASE_URL}/api/stats`);
                let data = await response.json();
                document.getElementById('free-badge').innerText = `🎉 ${data.remaining_free_slots} Free Slots Left!`;
            } catch (err) { 
                document.getElementById('free-badge').innerText = "⚠️ Server Offline";
            }
        }

        async function fetchNearbyRooms() {
            let maxRent = document.getElementById('budgetInput').value;
            let url = `${API_BASE_URL}/api/rooms/nearby?lat=${NAGPUR_LAT}&lng=${NAGPUR_LNG}&radius_km=25`;
            if(maxRent) url += `&max_rent=${maxRent}`;

            try {
                let response = await fetch(url);
                if (!response.ok) return;
                globalCachedRooms = await response.json();
                
                map.eachLayer((layer) => { if (layer instanceof L.Marker) map.removeLayer(layer); });

                globalCachedRooms.forEach(room => {
                    let marker = L.marker([room.latitude, room.longitude]).addTo(map);
                    let imageUrl = (room.media && room.media[0]) ? room.media[0] : 'https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af';
                    if(imageUrl.startsWith('uploads/') || imageUrl.startsWith('static/')) {
                        imageUrl = `${API_BASE_URL}/${imageUrl}`;
                    }
                    
                    let popupContent = `
                        <div style="text-align:center; width:180px; font-family:'Plus Jakarta Sans',sans-serif;">
                            <img src="${imageUrl}" style="width:100%; height:100px; object-fit:cover; border-radius:10px;" onerror="this.src='https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af'">
                            <h3 style="margin:8px 0 4px 0; font-size:16px; font-weight:800; color:var(--bg-dark);">₹${room.rent}/mo</h3>
                            <button onclick="launchFullScreenModal('${room.id}')" style="width:100%; padding:8px; background:var(--bg-dark); color:white; border:none; border-radius:6px; cursor:pointer; font-weight:700; font-family:inherit; font-size:12px;">🔍 View Details</button>
                        </div>
                    `;
                    marker.bindPopup(popupContent);
                });
            } catch (err) { console.log("Failed fetching pins."); }
        }

        function launchFullScreenModal(roomId) {
            const room = globalCachedRooms.find(r => r.id === roomId);
            if(!room) return;

            let imageUrl = (room.media && room.media[0]) ? room.media[0] : 'https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af';
            if(imageUrl.startsWith('uploads/') || imageUrl.startsWith('static/')) {
                imageUrl = `${API_BASE_URL}/${imageUrl}`;
            }
            document.getElementById('modal-img').src = imageUrl;
            document.getElementById('modal-rent').innerText = `₹${room.rent}/mo`;
            document.getElementById('modal-desc').innerText = room.description;
            
            const wrapper = document.getElementById('modal-contact-wrapper');
            wrapper.innerHTML = `<button onclick="setupModalScratchCard('${room.id}')" style="padding:12px 24px; background:#2563eb; color:white; border:none; border-radius:10px; font-weight:700; cursor:pointer; font-family:inherit; font-size:14px;">Reveal Contact Info</button>`;

            openModal('details-modal');
        }

        async function setupModalScratchCard(roomId) {
            try {
                let response = await fetch(`${API_BASE_URL}/api/rooms/${roomId}/reveal`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                let data = await response.json();
                
                let wrapper = document.getElementById('modal-contact-wrapper');
                wrapper.innerHTML = `
                    <div class="scratch-box">
                        <span>${data.phone}</span>
                        <canvas id="modal-canvas-${roomId}" class="scratch-canvas" width="220" height="55"></canvas>
                    </div>
                    <p style="font-size:13px; color:var(--text-muted); margin:8px 0 0 0;">Scratch card matrix to view Landlord Name: <b style="color:var(--bg-dark);">${data.landlord_name}</b></p>
                `;
                initModalCanvas(roomId);
            } catch (err) { alert("Please login again to reveal contacts."); }
        }

        function initModalCanvas(roomId) {
            const canvas = document.getElementById(`modal-canvas-${roomId}`);
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#cbd5e1';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#475569';
            ctx.font = 'bold 11px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Scratch to Reveal Contact Details 🖐️', 110, 32);
            
            let isDrawing = false;
            function scratch(e) {
                if (!isDrawing) return;
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - rect.left;
                const y = (e.clientY || e.touches[0].clientY) - rect.top;
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(x, y, 15, 0, Math.PI * 2);
                ctx.fill();
            }
            canvas.addEventListener('mousedown', () => isDrawing = true);
            canvas.addEventListener('mouseup', () => isDrawing = false);
            canvas.addEventListener('mousemove', scratch);
            canvas.addEventListener('touchstart', () => isDrawing = true);
            canvas.addEventListener('touchend', () => isDrawing = false);
            canvas.addEventListener('touchmove', scratch);
        }
        
        async function submitRoom(e) {
            e.preventDefault();  
            const formData = new FormData();
            formData.append('landlord_name', document.getElementById('form_name').value);
            formData.append('phone', document.getElementById('form_phone').value);
            formData.append('city', 'Nagpur');
            formData.append('rent', parseInt(document.getElementById('form_rent').value));
            formData.append('latitude', parseFloat(document.getElementById('form_lat').value));
            formData.append('longitude', parseFloat(document.getElementById('form_lng').value));
            formData.append('description', document.getElementById('form_desc').value);
            formData.append('amenities', 'WiFi'); 
            
            const fileInput = document.getElementById('form_files');
            if(fileInput.files.length > 0) {
                formData.append('files', fileInput.files[0]);
            }
            
            try {
                let response = await fetch(`${API_BASE_URL}/api/rooms`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken}` },
                    body: formData
                });
                
                if (response.ok) {
                    alert("Property successfully published on map!");
                    closeSidebar();
                    fetchNearbyRooms();
                } else {
                    alert("Failed to publish property. Ensure session is active.");
                }
            } catch (err) {
                alert("Server submission error.");
            }
        }

        function openModal(id) {
            const modal = document.getElementById(id);
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            modal.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 250);
        }
    </script>
</body>
</html>
